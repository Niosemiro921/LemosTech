services:
  postgres:
    image: postgres:16
    container_name: gas-expresso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gas_expresso
      POSTGRES_USER: gas_expresso
      POSTGRES_PASSWORD: change_me
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas_expresso -d gas_expresso"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: gas-expresso-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata: